in_scope:
- 序号: 1
  范围领域: 项目管理规范建设
  具体内容: 制定项目管理标准、流程、模板
- 序号: 2
  范围领域: 项目组织架构搭建
  具体内容: 设计项目治理架构、明确各方职责
- 序号: 3
  范围领域: 项目计划管理
  具体内容: 编制项目主计划、里程碑计划、专项计划
- 序号: 4
  范围领域: 沟通机制建设
  具体内容: 建立日常沟通、周报、月报、专题会机制
- 序号: 5
  范围领域: 风险问题管理
  具体内容: 识别风险、跟踪问题、建立升级机制
- 序号: 6
  范围领域: 关键工作方案
  具体内容: 协助制定关键工作组工作方案
- 序号: 7
  范围领域: 专项工作支持
  具体内容: 参与完成项目其他专项工作
- 序号: 8
  范围领域: 阶段评审支持
  具体内容: 支持各阶段里程碑评审与汇报
out_of_scope:
- 序号: 1
  除外事项: 核心系统开发
  说明: 不承担核心系统的开发、测试、运维工作
- 序号: 2
  除外事项: 硬件采购
  说明: 不参与硬件设备采购决策
- 序号: 3
  除外事项: 业务决策
  说明: 不替代行方进行业务方向决策
- 序号: 4
  除外事项: 供应商管理
  说明: 不直接管理实施商（仅提供监理咨询意见）
