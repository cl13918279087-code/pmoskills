沟通类型:
- 类型: 项目周报
  频率: 每周
  责任人: PMO/我司
  内容: 进度总结、下周计划、问题风险
  提交时间: 每周五12:00
- 类型: 项目月报
  频率: 每月
  责任人: PMO/我司
  内容: 总体进展、阶段成果、下月安排
  提交时间: 每月最后工作日24:00
- 类型: 项目群简报
  频率: 每月
  责任人: PMO
  内容: 项目群整体执行情况
  提交时间: 每月第一个工作日
- 类型: 项目例会
  频率: 每周
  责任人: PMO
  内容: 进度汇报、关键问题、下周安排
  提交时间: 每周一上午
- 类型: 里程碑汇报会
  频率: 重要节点
  责任人: PMO/我司
  内容: 向委员会汇报进度、问题、需决策事项
  提交时间: 节点完成后1周内
- 类型: 专题汇报
  频率: 按需
  责任人: PMO/我司
  内容: 重大风险/变更/专项工作
  提交时间: 触发后2天内
升级路径:
- 级别: 一般问题
  推进主体: 各项目组自行解决
  升级路径: —
- 级别: 升级问题（组内无法解决）
  推进主体: 项目组 → PMO/我司
  升级路径: 周报/邮件/专题会
- 级别: 重大问题（PMO无法协调）
  推进主体: PMO → 项目管理委员会
  升级路径: 专题汇报+决策请求
- 级别: 全局问题（委员会无法解决）
  推进主体: 委员会 → 行长/董事会
  升级路径: 升级汇报
